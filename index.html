<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Invoice Generator</h1>
    <p class="tagline">Create, track, and send invoices.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>New Invoice</h2>
      <form id="invoice-form">
        <label for="client-name">Client Name</label>
        <input type="text" id="client-name" placeholder="Acme Corp" required />

        <label for="invoice-number">Invoice #</label>
        <input type="text" id="invoice-number" placeholder="INV-0001" required />

        <label for="line-items">Line Items (one per line: description | amount)</label>
        <textarea id="line-items" rows="4" placeholder="Website design | 1500&#10;Hosting setup | 200"></textarea>

        <label for="tax-rate">Tax Rate (%)</label>
        <input type="number" id="tax-rate" value="0" min="0" max="100" step="0.01" />

        <button type="submit">Create Invoice</button>
      </form>
      <p id="status" class="status" hidden></p>
    </section>

    <section class="card">
      <h2>Invoices</h2>
      <ul id="invoice-list" class="invoice-list">
        <li class="empty">No invoices yet.</li>
      </ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
